quarkus.http.port=8080
app.name=${appName}

# Root HTML template served on the initial visit (default: index.html)
inertia.root-template=index.html
inertia.use-qute=true

# CSRF ownership: auto (default), framework, adapter or disabled
# inertia.security.mode=adapter

# Vert.x session auto-provisioning for flash and CSRF (default: true)
# inertia.session.enabled=true

# BigInt serialization as JSON numbers instead of strings (default: false)
# inertia.bigint-enabled=false

# SSR sidecar (default: false): npm run build:ssr && npm run ssr,
# then uncomment the next two lines to render through it (CSR fallback stays).
# inertia.ssr-enabled=true
# inertia.ssr-url=http://localhost:13714
