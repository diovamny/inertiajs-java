# Validation errors: redirect back with the error bag flashed.
- id: invalid-submit-redirects-back
  description: Invalid input redirects back instead of rendering.
  request:
    method: POST
    path: /tck/submit
    headers:
      X-Inertia: "true"
      Referer: ${baseUri}/tck/form
    contentType: application/json
    body: '{"name":""}'
  expect:
    status: 303
    locationEndsWith: /tck/form
    withCsrfToken: true

- id: invalid-submit-flashes-errors
  description: The next visit carries the error bag (runs after invalid-submit-redirects-back).
  request:
    method: GET
    path: /tck/page
    headers:
      X-Inertia: "true"
  expect:
    status: 200
    json:
      props.errors.name: required

- id: named-bag-submit-redirects-back
  description: Bean validation failures honor X-Inertia-Error-Bag with a 303.
  request:
    method: POST
    path: /tck/submit-valid
    headers:
      X-Inertia: "true"
      X-Inertia-Error-Bag: loginForm
      Referer: ${baseUri}/tck/form
    contentType: application/json
    body: '{"name":""}'
  expect:
    status: 303
    locationEndsWith: /tck/form
    withCsrfToken: true

- id: named-bag-errors-nested-on-reload
  description: Named-bag errors surface nested under the bag (runs after named-bag-submit-redirects-back).
  request:
    method: GET
    path: /tck/page
    headers:
      X-Inertia: "true"
  expect:
    status: 200
    jsonContains:
      # Field presence (not the message text: validator messages are locale-dependent).
      props.errors.loginForm: name

- id: multi-message-submit-redirects-back
  description: Explicit multi-message errors redirect back with flash (PROTO-053B).
  request:
    method: POST
    path: /tck/submit-multi
    headers:
      X-Inertia: "true"
      Referer: ${baseUri}/tck/form
    contentType: application/json
    body: '{}'
  expect:
    status: 303
    locationEndsWith: /tck/form
    withCsrfToken: true

- id: multi-message-errors-are-ordered-arrays-on-reload
  description: Each field carries its messages as an ordered array (runs after multi-message-submit-redirects-back).
  request:
    method: GET
    path: /tck/page
    headers:
      X-Inertia: "true"
  expect:
    status: 200
    json:
      props.errors.name[0]: required
      props.errors.name[1]: must be valid
