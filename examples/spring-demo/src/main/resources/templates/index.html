<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>spring-demo · Inertia.js v3</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f4f4f5; color: #18181b; }
        header { background: #18181b; color: #fff; padding: 0.9rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; }
        header a { color: #e4e4e7; text-decoration: none; font-weight: 600; }
        header a.active, header a:hover { color: #fff; }
        main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: #fff; border: 1px solid #e4e4e7; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
        .card h1, .card h2 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #e4e4e7; }
        input[type=text], input[type=email], input[type=search] { padding: 0.45rem 0.6rem; border: 1px solid #d4d4d8; border-radius: 6px; }
        button, .btn { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 0.45rem 0.9rem; cursor: pointer; text-decoration: none; display: inline-block; font-size: 0.9rem; }
        .btn.secondary { background: #52525b; }
        .btn.danger { background: #dc2626; }
        .flash { background: #dcfce7; border: 1px solid #86efac; color: #14532d; padding: 0.6rem 0.9rem; border-radius: 6px; margin-bottom: 1rem; }
        .error { color: #dc2626; font-size: 0.85rem; margin: 0.25rem 0; }
        .pagination { display: flex; gap: 0.4rem; margin-top: 1rem; }
        .pagination a { padding: 0.3rem 0.6rem; border: 1px solid #d4d4d8; border-radius: 6px; text-decoration: none; color: #18181b; }
        .pagination a.disabled { opacity: 0.4; pointer-events: none; }
        .muted { color: #71717a; }
        .stats { display: flex; gap: 1rem; }
        .stat { flex: 1; background: #fff; border: 1px solid #e4e4e7; border-radius: 8px; padding: 1rem; text-align: center; }
        .stat .value { font-size: 1.6rem; font-weight: 700; }
    </style>
    __INERTIA_SSR_HEAD__
</head>
<body>
    <div id="app" data-page="__INERTIA_PAGE__"></div>

    <script type="module">
        import { createApp, h } from "https://unpkg.com/vue@3.5.13/dist/vue.esm-browser.js";
        import { createInertiaApp } from "https://unpkg.com/@inertiajs/vue3@2.0.0/dist/inertia-vue3.esm.js";

        const Layout = {
            setup(props, { slots }) {
                return () => h("div", [
                    h("header", [
                        h(InertiaLink, { href: "/" }, "Dashboard"),
                        h(InertiaLink, { href: "/contacts" }, "Contactos")
                    ]),
                    h("main", slots.default())
                ]);
            }
        };

        const Dashboard = {
            props: ["stats", "monthlyStats", "welcome"],
            template: `
                <div class="card">
                    <h1>{{ welcome.title }}</h1>
                    <p class="muted">{{ welcome.message }}</p>
                </div>
                <div class="stats">
                    <div class="stat"><div class="value">{{ stats.contacts }}</div><div class="muted">Contactos</div></div>
                    <div class="stat"><div class="value">{{ stats.groups }}</div><div class="muted">Grupos</div></div>
                    <div class="stat"><div class="value">{{ stats.notes }}</div><div class="muted">Notas</div></div>
                </div>
                <div class="card" v-if="monthlyStats">
                    <h2>Estadísticas mensuales <span class="muted">(deferred)</span></h2>
                    <p>Visitas: {{ monthlyStats.visits }} · Crecimiento: {{ monthlyStats.growth }}% · Top: {{ monthlyStats.topPage }}</p>
                </div>`
        };

        const ContactsIndex = {
            props: ["contacts", "pagination", "filters", "success"],
            data() {
                return { search: this.filters.search };
            },
            methods: {
                submit() {
                    this.$inertia.get("/contacts", { search: this.search }, { preserveState: true, replace: true });
                },
                go(page) {
                    this.$inertia.get("/contacts", { search: this.search, page }, { preserveState: true, replace: true });
                },
                destroy(contact) {
                    if (confirm("¿Eliminar a " + contact.name + "?")) {
                        this.$inertia.delete("/contacts/" + contact.id);
                    }
                }
            },
            template: `
                <div class="card">
                    <h1>Contactos <span class="muted">({{ pagination.total }})</span></h1>
                    <p v-if="success" class="flash">{{ success }}</p>
                    <form @submit.prevent="submit" style="display:flex;gap:.5rem;margin-bottom:1rem">
                        <input type="search" v-model="search" placeholder="Buscar por nombre o email…">
                        <button type="submit">Buscar</button>
                    </form>
                    <table>
                        <thead><tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th></th></tr></thead>
                        <tbody>
                            <tr v-for="c in contacts" :key="c.id">
                                <td>{{ c.name }}</td>
                                <td>{{ c.email }}</td>
                                <td>{{ c.phone }}</td>
                                <td style="display:flex;gap:.4rem;justify-content:flex-end">
                                    <a class="btn secondary" :href="'/contacts/' + c.id + '/edit'">Editar</a>
                                    <button class="btn danger" @click="destroy(c)">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="pagination">
                        <a :class="{disabled: pagination.page <= 1}" @click.prevent="pagination.page > 1 && go(pagination.page - 1)" href="#">← Anterior</a>
                        <span class="muted" style="padding:.3rem .6rem">Página {{ pagination.page }} de {{ pagination.lastPage }}</span>
                        <a :class="{disabled: pagination.page >= pagination.lastPage}" @click.prevent="pagination.page < pagination.lastPage && go(pagination.page + 1)" href="#">Siguiente →</a>
                    </div>
                    <p style="margin-top:1rem"><a class="btn" href="/contacts/create">+ Nuevo contacto</a></p>
                </div>`
        };

        const ContactForm = {
            props: ["contact", "errors", "success"],
            data() {
                return { name: this.contact ? this.contact.name : "", email: this.contact ? this.contact.email : "", phone: this.contact ? this.contact.phone : "" };
            },
            methods: {
                submit() {
                    const url = this.contact ? "/contacts/" + this.contact.id : "/contacts";
                    const method = this.contact ? "put" : "post";
                    this.$inertia[method](url, { name: this.name, email: this.email, phone: this.phone });
                }
            },
            template: `
                <div class="card">
                    <h1>{{ contact ? "Editar contacto" : "Nuevo contacto" }}</h1>
                    <p v-if="success" class="flash">{{ success }}</p>
                    <form @submit.prevent="submit" style="display:grid;gap:.6rem;max-width:420px">
                        <label>Nombre<input type="text" v-model="name"></label>
                        <p class="error" v-if="errors.name">{{ errors.name }}</p>
                        <label>Email<input type="email" v-model="email"></label>
                        <p class="error" v-if="errors.email">{{ errors.email }}</p>
                        <label>Teléfono<input type="text" v-model="phone"></label>
                        <p class="error" v-if="errors.phone">{{ errors.phone }}</p>
                        <div style="display:flex;gap:.5rem;margin-top:.5rem">
                            <button type="submit">{{ contact ? "Guardar" : "Crear" }}</button>
                            <a class="btn secondary" href="/contacts">Cancelar</a>
                        </div>
                    </form>
                </div>`
        };

        const pages = {
            Dashboard,
            "Contacts/Index": ContactsIndex,
            "Contacts/Create": ContactForm,
            "Contacts/Edit": ContactForm
        };

        createInertiaApp({
            id: "app",
            resolve: (name) => pages[name] || Layout,
            setup({ el, App, props, plugin }) {
                return createApp({ render: () => h(Layout, null, { default: () => h(App, props) }) }).use(plugin).mount(el);
            }
        });
    </script>
    __INERTIA_SSR_BODY__
</body>
</html>
