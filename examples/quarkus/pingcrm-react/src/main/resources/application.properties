quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/pingcrm
quarkus.datasource.jdbc.max-size=16

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.http.port=8080

inertia.root-template=index.html
inertia.use-qute=true
inertia.version-strategy=custom
inertia.version-custom=1.0.0

# Enable request scope propagation to @Blocking worker threads (fixes test auth)
quarkus.blocking.request-scope-propagation=true
# Framework-owned security: quarkus-rest-csrf validates JAX-RS with the same
# XSRF-TOKEN cookie the official Inertia v3 client echoes automatically.
inertia.security.mode=framework
# The /e2e-probe-rx Reactive Routes fixture is CSRF-validated by the adapter
# filter (same session token as rest-csrf), so browser POSTs prove the
# reactive CSRF contract end to end.
inertia.security.reactive-csrf-paths=/e2e-probe-rx

quarkus.rest-csrf.cookie-name=XSRF-TOKEN
quarkus.rest-csrf.token-header-name=X-XSRF-TOKEN
quarkus.rest-csrf.cookie-http-only=false
quarkus.rest-csrf.require-form-url-encoded=false
%prod.quarkus.rest-csrf.cookie-force-secure=true
# NOTE: no token-signature-key on purpose. A signed cookie can never be
# echoed back by official Inertia clients (rest-csrf requires
# cookie == sign(header)), so signing breaks every SPA login.

quarkus.http.auth.permission.public.paths=/login,/logout,/e2e-probe,/e2e-probe/*,/e2e-probe-rx,/e2e-probe-rx/*,/assets/*,/img/*,/favicon.svg,/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.secured.paths=/*
quarkus.http.auth.permission.secured.policy=authenticated

pingcrm.seed.enabled=true
pingcrm.images.dir=./data/images

# React SSR: the Node SSR server (dist-ssr/ssr.mjs) is optional at runtime;
# quarkus-inertia falls back to client-side rendering when it is unreachable.
inertia.ssr-enabled=true
inertia.ssr-url=http://localhost:13714

quarkus.arc.index-dependency.quarkus-inertia=io.github.diovamny.quarkus.inertia
quarkus.arc.index-dependency.quarkus-inertia-security=io.github.diovamny.quarkus.inertia
# This demo owns "auth" props via its DB-backed contributor; keep the
# module's thin identity summary off so it never clobbers them.
inertia.security.auth-props-enabled=false
quarkus.http.test-port=8084
