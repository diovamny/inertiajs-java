<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    {! Inline script to detect system dark mode preference and apply it immediately !}
    <script>
        (function() {
            var match = document.cookie.match(/(?:^|; )appearance=([^;]+)/);
            var appearance = match ? match[1] : 'system';

            if (appearance === 'system') {
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                if (prefersDark) {
                    document.documentElement.classList.add('dark');
                }
            } else if (appearance === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    {! Inline style to set the HTML background color based on our theme in app.css !}
    <style>
        html {
            background-color: oklch(1 0 0);
        }

        html.dark {
            background-color: oklch(0.145 0 0);
        }
    </style>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>{#if pageTitle}{pageTitle}{#else}Inertia.js Demo App{/if}</title>
    {#if ssrHead}{ssrHead}{/if}
    <link rel="stylesheet" href="/assets/app.css" />
</head>
<body class="font-sans antialiased">
    <div id="app" {#if ssrBody}data-server-rendered="true"{/if}>{#if ssrBody}{ssrBody}{/if}</div>
    <script type="application/json" data-page="app">{dataPage}</script>
    <script type="module" src="/assets/app.js"></script>
</body>
</html>
