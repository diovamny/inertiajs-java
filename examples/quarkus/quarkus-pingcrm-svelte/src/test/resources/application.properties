# Test Configuration - H2 for fast tests
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:pingcrm-test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect

quarkus.flyway.enabled=false

inertia.root-template=index.html
inertia.use-qute=true
inertia.version-strategy=custom
inertia.version-custom=1.0.0
inertia.csrf-enabled=false

quarkus.log.level.io.github.dg.quarkus.inertia=DEBUG