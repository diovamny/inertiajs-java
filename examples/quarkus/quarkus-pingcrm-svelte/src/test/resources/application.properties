quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:pingcrmsvelte;DB_CLOSE_DELAY=-1
quarkus.datasource.jdbc.max-size=16

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.http.port=8084
quarkus.http.test-port=8085

inertia.root-template=index.html
inertia.use-qute=true
inertia.version-strategy=custom
inertia.version-custom=1.0.0

quarkus.blocking.request-scope-propagation=true
inertia.security.mode=framework

quarkus.rest-csrf.cookie-name=XSRF-TOKEN
quarkus.rest-csrf.token-header-name=X-XSRF-TOKEN
quarkus.rest-csrf.cookie-http-only=false
quarkus.rest-csrf.require-form-url-encoded=false

quarkus.http.auth.permission.public.paths=/login,/logout,/assets/*,/img/*,/favicon.svg,/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.secured.paths=/*
quarkus.http.auth.permission.secured.policy=authenticated

pingcrm.seed.enabled=true

quarkus.arc.index-dependency.quarkus-inertia=io.github.diovamny.quarkus.inertia
quarkus.arc.index-dependency.quarkus-inertia-security=io.github.diovamny.quarkus.inertia
