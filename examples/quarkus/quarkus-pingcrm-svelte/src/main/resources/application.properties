# Quarkus PingCRM Svelte Reactive Demo Configuration

# HTTP Server
quarkus.http.port=8082

# Database - PostgreSQL with Dev Services (auto-provisioned in dev/test)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=pingcrm
quarkus.datasource.password=pingcrm

# Dev Services - PostgreSQL auto-provisioning
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:16-alpine
quarkus.datasource.devservices.init-script=db/init.sql
quarkus.datasource.devservices.port=5432

# Hibernate Reactive
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

# Inertia
inertia.root-template=index.html
inertia.use-qute=true
inertia.version-strategy=vite-manifest
inertia.csrf-enabled=false

# Qute (server-side rendering)
quarkus.qute.check-templates=false

# Reactive PG Client
quarkus.reactive-pg-client.max-size=20

# Transactions
quarkus.transaction-manager.enable-recovery=false

# Logging
quarkus.log.level.io.quarkus=INFO
quarkus.log.level.io.github.dg.quarkus.inertia=DEBUG
quarkus.log.category."org.hibernate".level=WARN

# Dev Mode
quarkus.dev.ui.enabled=true

# Test configuration (H2 for fast tests)
# quarkus.test.profile=test