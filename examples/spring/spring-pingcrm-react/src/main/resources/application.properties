# Spring Boot PingCRM React Demo Configuration

# Server
server.port=8080

# Database - H2 (default) / PostgreSQL
spring.datasource.url=jdbc:h2:file:./data/pingcrm;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# PostgreSQL (uncomment for production)
# spring.datasource.url=jdbc:postgresql://localhost:5432/pingcrm
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=pingcrm
# spring.datasource.password=pingcrm

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Inertia
inertia.root-template=index.html
inertia.version-strategy=vite-manifest
inertia.csrf-enabled=false

# Security
spring.security.csrf.enabled=false

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.io.github.dg.spring.inertia=DEBUG

# Test
spring.test.database.replace=none