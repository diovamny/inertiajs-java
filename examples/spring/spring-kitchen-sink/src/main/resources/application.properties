spring.application.name=spring-kitchen-sink

spring.datasource.url=jdbc:h2:file:./data/spring-kitchen-sink
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

inertia.root-template=index.html
inertia.version-strategy=vite-manifest
# The Inertia v3 fetch client does not send X-XSRF-TOKEN automatically,
# so CSRF validation is disabled for this demo (see README).
inertia.csrf-enabled=false

kitchensink.seed.enabled=true