<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
        (function() {
            var match = document.cookie.match(/(?:^|; )appearance=([^;]+)/);
            var appearance = match ? match[1] : 'system';

            if (appearance === 'system') {
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                if (prefersDark) {
                    document.documentElement.classList.add('dark');
                }
            } else if (appearance === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <style>
        html {
            background-color: oklch(1 0 0);
        }

        html.dark {
            background-color: oklch(0.145 0 0);
        }
    </style>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Inertia.js Demo App</title>
    __INERTIA_SSR_HEAD__
    <link rel="stylesheet" href="/assets/app.css" />
</head>
<body class="font-sans antialiased">
    <div id="app" data-page="__INERTIA_PAGE__">__INERTIA_SSR_BODY__</div>
    <script type="application/json" data-page="app">__INERTIA_PAGE_JSON__</script>
    <script type="module" src="/assets/app.js"></script>
</body>
</html>
