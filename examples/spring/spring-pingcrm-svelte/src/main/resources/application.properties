# Spring Boot PingCRM Svelte Demo Configuration

# Server
server.port=8181

# Database - H2 (default) / PostgreSQL
spring.datasource.url=jdbc:h2:file:./data/pingcrm-svelte;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# PostgreSQL (uncomment for production)
# spring.datasource.url=jdbc:postgresql://localhost:5432/pingcrm
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=pingcrm
# spring.datasource.password=pingcrm

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Inertia
inertia.root-template=index.html
inertia.version-strategy=vite-manifest
# Framework-owned security: Spring Security validates CSRF with the same
# XSRF-TOKEN cookie the official Inertia v3 client echoes automatically.
inertia.security.mode=framework

# Images
pingcrm.seed.enabled=true
pingcrm.seed.organizations=100
pingcrm.seed.contacts=100
pingcrm.images.dir=./data/images

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.io.github.diovamny.spring.inertia=DEBUG

# Test
spring.test.database.replace=none
