spring.datasource.url=jdbc:h2:mem:pingcrmtest;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=none
spring.flyway.baseline-on-migrate=true

inertia.root-template=index.html
inertia.version-strategy=vite-manifest
inertia.csrf-enabled=false

pingcrm.seed.enabled=true
pingcrm.images.dir=./target/test-images