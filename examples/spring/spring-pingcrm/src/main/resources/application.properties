spring.application.name=spring-pingcrm

spring.datasource.url=jdbc:h2:file:./data/spring-pingcrm
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=none
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

inertia.root-template=index.html
inertia.version-strategy=vite-manifest
# Framework-owned security: Spring Security validates CSRF with the same
# XSRF-TOKEN cookie the official Inertia v3 client echoes automatically.
inertia.security.mode=framework

pingcrm.seed.enabled=true
pingcrm.seed.organizations=100
pingcrm.seed.contacts=100
pingcrm.images.dir=./data/images