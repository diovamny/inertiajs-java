spring.application.name=spring-pingcrm

spring.datasource.url=jdbc:h2:file:./data/spring-pingcrm
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=none
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

inertia.root-template=index.html
inertia.version-strategy=vite-manifest
# The Inertia v3 fetch client does not send X-XSRF-TOKEN automatically,
# so CSRF validation is disabled for this demo (see README).
inertia.csrf-enabled=false

pingcrm.seed.enabled=true
pingcrm.seed.organizations=100
pingcrm.seed.contacts=100
pingcrm.images.dir=./data/images