name: Release

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "auto = upload and publish; draft = upload only, publish by hand in the portal"
        type: choice
        default: auto
        options: [auto, draft]
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # Least privilege: the gh-release attach step needs to create releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          server-id: central
          server-username: ${{ secrets.CENTRAL_USERNAME }}
          server-password: ${{ secrets.CENTRAL_PASSWORD }}

      - name: Run full test suite
        run: mvn clean test -T 1C

      - name: Diagnose Central server wiring (lengths only, values stay masked)
        # Prints whether the `central` server entry exists and the LENGTH of
        # the username Maven will send. Catches truncated/empty credentials
        # without ever printing secret values (GitHub masks them anyway).
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import os
          p = os.path.expanduser('~/.m2/settings.xml')
          try:
              t = ET.parse(p)
          except Exception as e:
              print('DIAG settings.xml unreadable:', e)
              raise SystemExit(0)
          srv = t.getroot().find("./servers/server[id='central']")
          if srv is None:
              print('DIAG NO central server entry in settings.xml')
          else:
              u = srv.findtext('username', '')
              pw = srv.findtext('password', '')
              print('DIAG central server entry present')
              print('DIAG username-len:', len(u))
              print('DIAG password-empty:', str(not pw))
          EOF

      - name: Check release secrets are set
        # Fails fast with a clear message instead of a cryptic 401 at upload
        # time. Compares nothing secret: only whether each value is non-empty.
        env:
          HAS_CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME != '' }}
          HAS_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD != '' }}
          HAS_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
          HAS_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE != '' }}
        run: |
          missing=""
          [ "$HAS_CENTRAL_USERNAME" = "true" ] || missing="$missing CENTRAL_USERNAME"
          [ "$HAS_CENTRAL_PASSWORD" = "true" ] || missing="$missing CENTRAL_PASSWORD"
          [ "$HAS_GPG_PRIVATE_KEY" = "true" ] || missing="$missing GPG_PRIVATE_KEY"
          [ "$HAS_GPG_PASSPHRASE" = "true" ] || missing="$missing GPG_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing"
            exit 1
          fi
          echo "All release secrets are set"

      - name: Verify GPG signing setup
        # Fails fast with a clear message when GPG_PRIVATE_KEY/GPG_PASSPHRASE
        # secrets are missing or mismatched, instead of failing mid-deploy.
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          gpg --list-secret-keys --keyid-format LONG
          echo "gpg-probe" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" --clearsign -o /dev/null
          echo "GPG signing setup OK"

      - name: OWASP Dependency Check
        # Releases must not skip dependency vulnerability scanning. Runs only
        # when NVD_API_KEY is configured; fails on CVSS >= 8 (see root pom).
        # NOTE: the secrets context is not allowed in `if:`, so the secret is
        # mapped to env first and the condition reads env instead.
        if: ${{ env.NVD_API_KEY != '' }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn verify -Pquality-gates -DskipTests -DskipStaticAnalysis=true -DskipDependencyCheck=false

      - name: Write Maven Central server credentials
        # actions/setup-java does not reliably leave a `central` server entry
        # in ~/.m2/settings.xml, so write/merge it explicitly. Values come
        # from env (never echoed); ElementTree escapes XML for us.
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import os
          p = os.path.expanduser('~/.m2/settings.xml')
          try:
              t = ET.parse(p)
              root = t.getroot()
          except Exception:
              root = ET.Element('settings')
              t = ET.ElementTree(root)
          servers = root.find('servers')
          if servers is None:
              servers = ET.SubElement(root, 'servers')
          for s in list(servers.findall('server')):
              if (s.findtext('id', '') or '').strip() == 'central':
                  servers.remove(s)
          srv = ET.SubElement(servers, 'server')
          ET.SubElement(srv, 'id').text = 'central'
          ET.SubElement(srv, 'username').text = os.environ['CENTRAL_USERNAME']
          ET.SubElement(srv, 'password').text = os.environ['CENTRAL_PASSWORD']
          os.makedirs(os.path.dirname(p), exist_ok=True)
          t.write(p, xml_declaration=True, encoding='utf-8')
          print('settings.xml now carries the central server entry')
          EOF

      - name: Build, sign and publish to Sonatype Central Portal
        # maven-gpg-plugin reads MAVEN_GPG_PASSPHRASE directly from the
        # environment, bypassing the settings.xml decryption path that fails
        # without settings-security.xml on fresh runners. The `archetypes`
        # profile adds the 4 starter archetypes to the release reactor.
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn clean deploy -Prelease,archetypes -DskipTests -Dcentral.autoPublish=${{ inputs.publish_mode == 'draft' && 'false' || 'true' }}

      - name: Attach release artifacts
        # GitHub Releases require a tag: only attach on tag pushes, not on
        # manual dispatches (which are trials).
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            quarkus-inertia/target/quarkus-inertia-*.jar
            spring-inertia/target/spring-inertia-*.jar
            archetypes/inertia-spring-vue-archetype/target/inertia-spring-vue-archetype-*.jar
            archetypes/inertia-spring-react-archetype/target/inertia-spring-react-archetype-*.jar
            archetypes/inertia-quarkus-vue-archetype/target/inertia-quarkus-vue-archetype-*.jar
            archetypes/inertia-quarkus-react-archetype/target/inertia-quarkus-react-archetype-*.jar
          generate_release_notes: true