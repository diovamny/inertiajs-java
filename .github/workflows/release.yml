name: Release

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "kept for explicitness; releases are always draft (publish by hand in the portal)"
        type: choice
        default: draft
        options: [auto, draft]
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # Least privilege: the gh-release attach step needs to create releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          server-id: central
          server-username: ${{ secrets.CENTRAL_USERNAME }}
          server-password: ${{ secrets.CENTRAL_PASSWORD }}

      - name: Run tests and blocking quality gates
        # Releases fail when ANY gate fails: unit/integration suites,
        # Checkstyle and SpotBugs (thresholds in the root pom). OWASP stays
        # in its conditional step below (needs NVD_API_KEY). Skip flags are
        # for local development only.
        run: mvn clean verify -Pquality-gates -DskipStaticAnalysis=false -DskipMutationAnalysis=true -DskipDependencyCheck=true

      - name: PIT mutation testing (report only)
        # NOT blocking: the pitest 1.16.3 coverage minion aborts with
        # UNKNOWN_ERROR on JDK 21 (reproduced on Linux CI and Windows, with
        # and without JaCoCo, serial and parallel) before running a single
        # mutant — a toolchain bug, not a code-quality signal. The report is
        # still published for review. Follow-up: retry with pitest >= 1.17
        # and/or an isolated argLine, then flip this step back to blocking.
        continue-on-error: true
        run: mvn verify -Pquality-gates -DskipStaticAnalysis=true -DskipMutationAnalysis=false -DskipDependencyCheck=true

      - name: Diagnose Central server wiring (lengths only, values stay masked)
        # Prints whether the `central` server entry exists and the LENGTH of
        # the username Maven will send. Catches truncated/empty credentials
        # without ever printing secret values (GitHub masks them anyway).
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import os
          p = os.path.expanduser('~/.m2/settings.xml')
          try:
              t = ET.parse(p)
          except Exception as e:
              print('DIAG settings.xml unreadable:', e)
              raise SystemExit(0)
          srv = t.getroot().find("./servers/server[id='central']")
          if srv is None:
              print('DIAG NO central server entry in settings.xml')
          else:
              u = srv.findtext('username', '')
              pw = srv.findtext('password', '')
              print('DIAG central server entry present')
              print('DIAG username-len:', len(u))
              print('DIAG password-empty:', str(not pw))
          EOF

      - name: Check release secrets are set
        # Fails fast with a clear message instead of a cryptic 401 at upload
        # time. Compares nothing secret: only whether each value is non-empty.
        env:
          HAS_CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME != '' }}
          HAS_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD != '' }}
          HAS_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
          HAS_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE != '' }}
        run: |
          missing=""
          [ "$HAS_CENTRAL_USERNAME" = "true" ] || missing="$missing CENTRAL_USERNAME"
          [ "$HAS_CENTRAL_PASSWORD" = "true" ] || missing="$missing CENTRAL_PASSWORD"
          [ "$HAS_GPG_PRIVATE_KEY" = "true" ] || missing="$missing GPG_PRIVATE_KEY"
          [ "$HAS_GPG_PASSPHRASE" = "true" ] || missing="$missing GPG_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing"
            exit 1
          fi
          echo "All release secrets are set"

      - name: Verify GPG signing setup
        # Fails fast with a clear message when GPG_PRIVATE_KEY/GPG_PASSPHRASE
        # secrets are missing or mismatched, instead of failing mid-deploy.
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          gpg --list-secret-keys --keyid-format LONG
          echo "gpg-probe" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" --clearsign -o /dev/null
          echo "GPG signing setup OK"

      - name: OWASP Dependency Check
        # Releases must not skip dependency vulnerability scanning. Runs only
        # when NVD_API_KEY is configured; fails on CVSS >= 8 (see root pom).
        # NOTE: the secrets context is not allowed in `if:`, so the secret is
        # mapped to env first and the condition reads env instead.
        if: ${{ env.NVD_API_KEY != '' }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn verify -Pquality-gates -DskipTests -DskipStaticAnalysis=true -DskipDependencyCheck=false

      - name: Write Maven Central server credentials
        # actions/setup-java does not reliably leave a `central` server entry
        # in ~/.m2/settings.xml, so write/merge it explicitly. Values come
        # from env (never echoed); ElementTree escapes XML for us.
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import os
          p = os.path.expanduser('~/.m2/settings.xml')
          try:
              t = ET.parse(p)
              root = t.getroot()
          except Exception:
              root = ET.Element('settings')
              t = ET.ElementTree(root)
          servers = root.find('servers')
          if servers is None:
              servers = ET.SubElement(root, 'servers')
          for s in list(servers.findall('server')):
              if (s.findtext('id', '') or '').strip() == 'central':
                  servers.remove(s)
          srv = ET.SubElement(servers, 'server')
          ET.SubElement(srv, 'id').text = 'central'
          ET.SubElement(srv, 'username').text = os.environ['CENTRAL_USERNAME']
          ET.SubElement(srv, 'password').text = os.environ['CENTRAL_PASSWORD']
          os.makedirs(os.path.dirname(p), exist_ok=True)
          t.write(p, xml_declaration=True, encoding='utf-8')
          print('settings.xml now carries the central server entry')
          EOF

      - name: Build, sign and upload to Sonatype Central Portal (draft only)
        # maven-gpg-plugin reads MAVEN_GPG_PASSPHRASE directly from the
        # environment, bypassing the settings.xml decryption path that fails
        # without settings-security.xml on fresh runners. The `archetypes`
        # profile adds the 6 starter archetypes to the release reactor.
        # Policy: releases are ALWAYS draft (autoPublish=false); a human
        # publishes the deployment by hand in the Central Portal after
        # verifying artifacts, javadoc and the SBOM. The workflow input
        # below is kept for explicitness but no longer switches the mode.
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn clean deploy -Prelease,archetypes -DskipTests -Dcentral.autoPublish=false

      - name: Generate aggregate SBOM (outside the parallel reactor)
        # makeAggregateBom is a reactor aggregator and must NOT run inside
        # the parallel deploy above (it deadlocks against central-publishing's
        # end-of-reactor wait). A single standalone invocation is safe.
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Compute release artifact hashes (SLSA subjects)
        # Runs on tag pushes only; manual dispatches skip it, and the
        # provenance job additionally guards on a non-empty output.
        id: hashes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mapfile -t FILES < <(ls -1 \
            inertia-core/target/inertia-core-*.jar \
            inertia-tck/target/inertia-tck-*.jar \
            quarkus-inertia/target/quarkus-inertia-*.jar \
            spring-inertia/target/spring-inertia-*.jar \
            quarkus-inertia-security/target/quarkus-inertia-security-*.jar \
            spring-inertia-security/target/spring-inertia-security-*.jar \
            archetypes/inertia-spring-vue-archetype/target/inertia-spring-vue-archetype-*.jar \
            archetypes/inertia-spring-react-archetype/target/inertia-spring-react-archetype-*.jar \
            archetypes/inertia-spring-svelte-archetype/target/inertia-spring-svelte-archetype-*.jar \
            archetypes/inertia-quarkus-vue-archetype/target/inertia-quarkus-vue-archetype-*.jar \
            archetypes/inertia-quarkus-react-archetype/target/inertia-quarkus-react-archetype-*.jar \
            archetypes/inertia-quarkus-svelte-archetype/target/inertia-quarkus-svelte-archetype-*.jar \
            | grep -v -e '-sources' -e '-javadoc' -e '\.original$' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "hashes=" >> "$GITHUB_OUTPUT"
          else
            hashes=$(printf '%s\n' "${FILES[@]}" | xargs sha256sum | base64 -w0 | tr -d '\n')
            echo "hashes=$hashes" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach release artifacts
        # GitHub Releases require a tag: only attach on tag pushes, not on
        # manual dispatches (which are trials).
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            inertia-core/target/inertia-core-*.jar
            inertia-tck/target/inertia-tck-*.jar
            quarkus-inertia/target/quarkus-inertia-*.jar
            spring-inertia/target/spring-inertia-*.jar
            quarkus-inertia-security/target/quarkus-inertia-security-*.jar
            spring-inertia-security/target/spring-inertia-security-*.jar
            archetypes/inertia-spring-vue-archetype/target/inertia-spring-vue-archetype-*.jar
            archetypes/inertia-spring-react-archetype/target/inertia-spring-react-archetype-*.jar
            archetypes/inertia-spring-svelte-archetype/target/inertia-spring-svelte-archetype-*.jar
            archetypes/inertia-quarkus-vue-archetype/target/inertia-quarkus-vue-archetype-*.jar
            archetypes/inertia-quarkus-react-archetype/target/inertia-quarkus-react-archetype-*.jar
            archetypes/inertia-quarkus-svelte-archetype/target/inertia-quarkus-svelte-archetype-*.jar
            target/bom.xml
            target/bom.json
          generate_release_notes: true

    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}

  provenance:
    name: SLSA provenance
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/') && needs.publish.outputs.hashes != ''
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.publish.outputs.hashes }}