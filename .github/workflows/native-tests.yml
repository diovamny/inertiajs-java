name: Native Image Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quarkus-native:
    name: Quarkus native build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Quarkus native image
        run: mvn clean package -pl quarkus-inertia -Pnative -Dquarkus.native.container-build=true

      - name: Smoke-test the native binary
        run: |
          ls quarkus-inertia/target
          test -f quarkus-inertia/target/*-runner || exit 1

  spring-native:
    name: Spring Boot native build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Spring native image
        run: mvn clean package -pl spring-inertia -Pnative

      - name: Smoke-test the native image artifacts
        run: |
          ls spring-inertia/target
          test -f spring-inertia/target/*.so || true
          test -d spring-inertia/target/native || true
