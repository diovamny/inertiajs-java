name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-and-quality:
    name: Java ${{ matrix.java }} / unit + quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify conformance matrix
        # Fails when a documented test class does not exist or is not executed.
        run: node scripts/check-conformance-matrix.mjs

      - name: Verify single-source version
        # Fails when version.properties, poms, README, CHANGELOG or ROADMAP disagree.
        run: node scripts/check-versions.mjs

      - name: Verify pinned official clients
        # Fails unless every template + demo package.json declares exactly
        # 3.7.1 and every lockfile resolves 3.7.1 (Fase A).
        run: node scripts/check-client-versions.mjs

      - name: Verify generated compliance matrix
        # Regenerates docs/protocol-compatibility.md from the YAML source of
        # truth and fails on any diff (the markdown is a build artifact).
        run: |
          node scripts/generate-compatibility-matrix.mjs
          git diff --exit-code docs/protocol-compatibility.md

      - name: Run Maven unit/integration tests
        run: ./mvnw clean test -T 1C

      - name: Run quality gates
        # Static analysis (Checkstyle/SpotBugs) executes and reports; OWASP stays
        # skipped here (it needs NVD_API_KEY) and runs in the release workflow.
        run: ./mvnw verify -Pquality-gates -DskipDependencyCheck=true -DskipStaticAnalysis=false

  examples:
    name: Demo smoke tests
    runs-on: ubuntu-latest
    needs: unit-and-quality
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install adapters (resolve locally, faster and hermetic)
        # Installs the current reactor artifacts so demos resolve them
        # without depending on Maven Central state. Installs every default
        # module (core, both adapters, both security integrations and the
        # TCK): the demos need the security artifacts and the adapters'
        # test classpath needs the TCK, none of which is published yet.
        run: ./mvnw -B -q -DskipTests install

      - name: Spring demo smoke
        run: ./mvnw clean test -pl examples/spring/spring-pingcrm,examples/spring/spring-pingcrm-react,examples/spring/spring-pingcrm-svelte,examples/spring/spring-kitchen-sink -Pexamples

      - name: Quarkus demo smoke
        run: ./mvnw clean test -pl examples/quarkus/pingcrm,examples/quarkus/pingcrm-react,examples/quarkus/quarkus-pingcrm-svelte,examples/quarkus/kitchen-sink,examples/quarkus/demo-app -Pexamples

  demo-visit:
    name: Demo visit (${{ matrix.demo }})
    runs-on: ubuntu-latest
    needs: examples
    strategy:
      fail-fast: false
      matrix:
        include:
          - demo: spring-pingcrm
            module: examples/spring/spring-pingcrm
            jar: spring-pingcrm-*.jar
            port: 8080
            path: /login
            component: Auth/Login
          - demo: spring-pingcrm-react
            module: examples/spring/spring-pingcrm-react
            jar: spring-pingcrm-react-*.jar
            port: 8080
            path: /login
            component: Auth/Login
          - demo: spring-pingcrm-svelte
            module: examples/spring/spring-pingcrm-svelte
            jar: spring-pingcrm-svelte-*.jar
            port: 8181
            path: /login
            component: Auth/Login
          - demo: spring-kitchen-sink
            module: examples/spring/spring-kitchen-sink
            jar: spring-kitchen-sink-*.jar
            port: 8080
            path: /login
            component: Auth/Login
          - demo: quarkus-demo-app
            module: examples/quarkus/demo-app
            jar: quarkus-app/quarkus-run.jar
            port: 8080
            path: /persons
            component: Persons/Index
          - demo: quarkus-kitchen-sink
            module: examples/quarkus/kitchen-sink
            jar: quarkus-app/quarkus-run.jar
            port: 8081
            path: /login
            component: Auth/Login
          - demo: quarkus-pingcrm
            module: examples/quarkus/pingcrm
            jar: quarkus-app/quarkus-run.jar
            port: 8081
            path: /login
            component: Auth/Login
          - demo: quarkus-pingcrm-react
            module: examples/quarkus/pingcrm-react
            jar: quarkus-app/quarkus-run.jar
            port: 8080
            path: /login
            component: Auth/Login
          - demo: quarkus-pingcrm-svelte
            module: examples/quarkus/quarkus-pingcrm-svelte
            jar: quarkus-app/quarkus-run.jar
            port: 8082
            path: /login
            component: Auth/Login
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Package demo
        # Boot with CWD = module dir: H2 file DBs (./data/…) and uploads
        # resolve relative to CWD, and same-named DBs must not mix (Fase C).
        run: ./mvnw -B -q -DskipTests package -pl ${{ matrix.module }} -Pexamples -am

      - name: Boot and certify visit (Fase C)
        working-directory: ${{ matrix.module }}
        run: |
          JAR=$(ls target/${{ matrix.jar }} | grep -v '\.original$' | head -n 1)
          echo "Starting $JAR"
          nohup java -jar "$JAR" > "$GITHUB_WORKSPACE/demo-visit.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/demo-visit.pid"
          for i in $(seq 1 48); do
            if curl -sf "http://localhost:${{ matrix.port }}${{ matrix.path }}" > /dev/null; then
              echo "Demo is up"
              break
            fi
            sleep 5
          done
          curl -sf "http://localhost:${{ matrix.port }}${{ matrix.path }}" | grep -q 'id="app"'
          curl -sf -H 'X-Inertia: true' "http://localhost:${{ matrix.port }}${{ matrix.path }}" | grep -q '"component":"${{ matrix.component }}"'
          echo "Visit certified: HTML shell + Inertia JSON ${{ matrix.component }}"
          kill "$(cat $GITHUB_WORKSPACE/demo-visit.pid)" || true
          rm -f "$GITHUB_WORKSPACE/demo-visit.pid"

      - name: Upload demo log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: demo-visit-${{ matrix.demo }}
          path: demo-visit.log
          if-no-files-found: ignore

  archetypes:
    name: Archetype ${{ matrix.archetype }}
    runs-on: ubuntu-latest
    needs: unit-and-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - archetype: inertia-spring-vue-archetype
            framework-version: 4.1.0
            starter-kind: spring
            starter-jar: hello-inertia-*.jar
          - archetype: inertia-spring-react-archetype
            framework-version: 4.1.0
            starter-kind: spring
            starter-jar: hello-inertia-*.jar
          - archetype: inertia-spring-svelte-archetype
            framework-version: 4.1.0
            starter-kind: spring
            starter-jar: hello-inertia-*.jar
          - archetype: inertia-quarkus-vue-archetype
            framework-version: 3.39.2
            starter-kind: quarkus
            starter-jar: quarkus-app/quarkus-run.jar
          - archetype: inertia-quarkus-react-archetype
            framework-version: 3.39.2
            starter-kind: quarkus
            starter-jar: quarkus-app/quarkus-run.jar
          - archetype: inertia-quarkus-svelte-archetype
            framework-version: 3.39.2
            starter-kind: quarkus
            starter-jar: quarkus-app/quarkus-run.jar
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0

      - name: Install adapters and archetypes
        run: ./mvnw -B -q -DskipTests clean install -P archetypes

      - name: Generate starter from archetype
        run: >
          ./mvnw -B org.apache.maven.plugins:maven-archetype-plugin:3.3.1:generate
          -DarchetypeCatalog=local
          -DarchetypeGroupId=io.github.diovamny
          -DarchetypeArtifactId=${{ matrix.archetype }}
          -DarchetypeVersion=0.0.5
          -DgroupId=com.acme
          -DartifactId=hello-inertia
          -Dpackage=com.acme.hello
          -DappName="Hello Inertia"
          -DinertiaAdapterVersion=0.0.5
          -DjavaVersion=21
          -DframeworkVersion=${{ matrix.framework-version }}
        working-directory: /tmp

      - name: Build and test generated starter (Java + frontend)
        run: ./mvnw -B test
        working-directory: /tmp/hello-inertia

      - name: Boot smoke + visit certification (Fase B)
        # Proves the generated app (with explicit inertia-core) boots and
        # serves the Welcome visit as HTML shell and Inertia JSON page.
        # Starters use adapter-mode CSRF (no signature key needed).
        working-directory: /tmp/hello-inertia
        run: |
          ./mvnw -B -q -DskipTests package
          JAR=$(ls target/${{ matrix.starter-jar }} | grep -v '\.original$' | head -n 1)
          echo "Starting $JAR"
          nohup java -jar "$JAR" > "$GITHUB_WORKSPACE/starter-app.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/starter-app.pid"
          for i in $(seq 1 48); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Starter is up"
              break
            fi
            sleep 5
          done
          curl -sf http://localhost:8080/ | grep -q 'id="app"'
          curl -sf -H 'X-Inertia: true' http://localhost:8080/ | grep -q '"component":"Welcome"'
          echo "Starter serves HTML shell and Inertia JSON (inertia-core wired)"
          kill "$(cat $GITHUB_WORKSPACE/starter-app.pid)" || true
          rm -f "$GITHUB_WORKSPACE/starter-app.pid"

      - name: Upload starter boot log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: archetype-${{ matrix.archetype }}-boot
          path: starter-app.log
          if-no-files-found: ignore

      - name: Upload starter test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: archetype-${{ matrix.archetype }}-reports
          path: |
            /tmp/hello-inertia/target/surefire-reports/
            /tmp/hello-inertia/src/main/webui/dist/
          if-no-files-found: ignore

  e2e:
    name: E2E contracts (${{ matrix.demo }})
    runs-on: ubuntu-latest
    needs: examples
    env:
      # E2E runs over plain http: Secure cookies would never be stored by the
      # browser, so browser logins cannot complete. Production (https) keeps
      # %prod.cookie-force-secure=true. No signature key: rest-csrf signed
      # cookies cannot be echoed by official clients (M4b-01).
      QUARKUS_REST_CSRF_COOKIE_FORCE_SECURE: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - demo: spring
            module: examples/spring/spring-kitchen-sink
            base-url: http://localhost:8080
            health-url: http://localhost:8080/actuator/health
            jar: spring-kitchen-sink-*.jar
            spec: inertia-contracts.spec.ts
          - demo: quarkus
            module: examples/quarkus/kitchen-sink
            base-url: http://localhost:8081
            health-url: http://localhost:8081/q/health
            jar: quarkus-app/quarkus-run.jar
            spec: inertia-contracts.spec.ts
          - demo: spring-pingcrm
            module: examples/spring/spring-pingcrm
            base-url: http://localhost:8080
            health-url: http://localhost:8080/actuator/health
            jar: spring-pingcrm-*.jar
            spec: pingcrm-contracts.spec.ts
          - demo: spring-pingcrm-react
            module: examples/spring/spring-pingcrm-react
            base-url: http://localhost:8080
            health-url: http://localhost:8080/actuator/health
            jar: spring-pingcrm-react-*.jar
            spec: pingcrm-contracts.spec.ts
          - demo: spring-pingcrm-svelte
            module: examples/spring/spring-pingcrm-svelte
            base-url: http://localhost:8181
            health-url: http://localhost:8181/actuator/health
            jar: spring-pingcrm-svelte-*.jar
            spec: pingcrm-contracts.spec.ts
          - demo: quarkus-pingcrm
            module: examples/quarkus/pingcrm
            base-url: http://localhost:8081
            health-url: http://localhost:8081/q/health
            jar: quarkus-app/quarkus-run.jar
            spec: pingcrm-contracts.spec.ts
          - demo: quarkus-pingcrm-react
            module: examples/quarkus/pingcrm-react
            base-url: http://localhost:8080
            health-url: http://localhost:8080/q/health
            jar: quarkus-app/quarkus-run.jar
            spec: pingcrm-contracts.spec.ts
          - demo: quarkus-pingcrm-svelte
            module: examples/quarkus/quarkus-pingcrm-svelte
            base-url: http://localhost:8082
            health-url: http://localhost:8082/q/health
            jar: quarkus-app/quarkus-run.jar
            spec: pingcrm-contracts.spec.ts
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Package demo
        run: ./mvnw -B -q -DskipTests package -pl ${{ matrix.module }} -Pexamples -am

      - name: Start demo
        working-directory: ${{ matrix.module }}
        run: |
          JAR=$(ls target/${{ matrix.jar }} | grep -v '\.original$' | head -n 1)
          echo "Starting $JAR"
          nohup java -jar "$JAR" > "$GITHUB_WORKSPACE/e2e-app.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/e2e-app.pid"

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 48); do
            if curl -sf "${{ matrix.health-url }}" > /dev/null; then
              echo "Demo is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Demo did not become healthy in time"
          exit 1

      - name: Run Playwright contract suite
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ matrix.base-url }}
        run: npx playwright test --config playwright.config.ts --reporter=line ${{ matrix.spec }}

      - name: Stop demo
        if: always()
        run: |
          if [ -f e2e-app.pid ]; then
            kill "$(cat e2e-app.pid)" || true
            rm -f e2e-app.pid
          fi

      - name: Upload E2E evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ matrix.demo }}-evidence
          path: |
            e2e/test-results/
            e2e-app.log
          if-no-files-found: ignore

  ssr-e2e:
    name: SSR E2E (${{ matrix.archetype }})
    runs-on: ubuntu-latest
    needs: unit-and-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - archetype: inertia-spring-vue-archetype
            framework-version: 4.1.0
            starter-jar: hello-inertia-*.jar
          - archetype: inertia-quarkus-vue-archetype
            framework-version: 3.39.2
            starter-jar: quarkus-app/quarkus-run.jar
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Install adapters and archetypes
        run: ./mvnw -B -q -DskipTests clean install -P archetypes

      - name: Generate starter from archetype
        run: >
          ./mvnw -B org.apache.maven.plugins:maven-archetype-plugin:3.3.1:generate
          -DarchetypeCatalog=local
          -DarchetypeGroupId=io.github.diovamny
          -DarchetypeArtifactId=${{ matrix.archetype }}
          -DarchetypeVersion=0.0.5
          -DgroupId=com.acme
          -DartifactId=hello-inertia
          -Dpackage=com.acme.hello
          -DappName="Hello Inertia"
          -DinertiaAdapterVersion=0.0.5
          -DjavaVersion=21
          -DframeworkVersion=${{ matrix.framework-version }}
        working-directory: /tmp

      - name: Build client + SSR bundle
        working-directory: /tmp/hello-inertia/src/main/webui
        run: npm ci && npm run build && npm run build:ssr

      - name: Package starter
        working-directory: /tmp/hello-inertia
        run: ./mvnw -B -q -DskipTests package

      - name: Run SSR render + hydration specs
        working-directory: e2e
        env:
          E2E_SSR_URL: http://localhost:8080
        run: |
          (cd /tmp/hello-inertia/src/main/webui && nohup node ssr-server.mjs > "$GITHUB_WORKSPACE/ssr-sidecar.log" 2>&1 & echo $! > "$GITHUB_WORKSPACE/ssr-sidecar.pid")
          JAR=$(ls /tmp/hello-inertia/target/${{ matrix.starter-jar }} | grep -v '\.original$' | head -n 1)
          INERTIA_SSR_ENABLED=true nohup java -jar "$JAR" > "$GITHUB_WORKSPACE/ssr-app.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/ssr-app.pid"
          for i in $(seq 1 48); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Starter is up"
              break
            fi
            sleep 5
          done
          npx playwright test --config playwright.config.ts --reporter=line ssr-contracts.spec.ts -g "server-rendered|hydrates"
          kill "$(cat $GITHUB_WORKSPACE/ssr-app.pid)" "$(cat $GITHUB_WORKSPACE/ssr-sidecar.pid)" || true
          rm -f "$GITHUB_WORKSPACE/ssr-app.pid" "$GITHUB_WORKSPACE/ssr-sidecar.pid"

      - name: Run CSR fallback spec (sidecar down)
        working-directory: e2e
        env:
          E2E_SSR_URL: http://localhost:8080
        run: |
          JAR=$(ls /tmp/hello-inertia/target/${{ matrix.starter-jar }} | grep -v '\.original$' | head -n 1)
          INERTIA_SSR_ENABLED=true nohup java -jar "$JAR" > "$GITHUB_WORKSPACE/ssr-fallback.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/ssr-fallback.pid"
          for i in $(seq 1 48); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Starter is up"
              break
            fi
            sleep 5
          done
          npx playwright test --config playwright.config.ts --reporter=line ssr-contracts.spec.ts -g "fallback"
          kill "$(cat $GITHUB_WORKSPACE/ssr-fallback.pid)" || true
          rm -f "$GITHUB_WORKSPACE/ssr-fallback.pid"

      - name: Upload SSR evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ssr-e2e-${{ matrix.archetype }}-evidence
          path: |
            e2e/test-results/
            ssr-sidecar.log
            ssr-app.log
            ssr-fallback.log
          if-no-files-found: ignore

  clean-checkout:
    name: Clean checkout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify versions + matrices (no Maven needed)
        run: |
          node scripts/check-versions.mjs
          node scripts/generate-compatibility-matrix.mjs
          git diff --exit-code docs/protocol-compatibility.md
          node scripts/check-conformance-matrix.mjs

      - name: Unit/integration via Maven Wrapper (no global Maven)
        run: ./mvnw -B clean test -T 1C
        shell: bash

      - name: Upload Surefire evidence on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: clean-checkout-${{ matrix.os }}-surefire
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
