name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-and-quality:
    name: Java ${{ matrix.java }} / unit + quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Maven unit/integration tests
        run: mvn clean test -T 1C

      - name: Run quality gates
        run: mvn verify -Pquality-gates -DskipDependencyCheck=true

  examples:
    name: Demo smoke tests
    runs-on: ubuntu-latest
    needs: unit-and-quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Spring demo smoke
        run: mvn clean test -pl examples/spring/spring-pingcrm,examples/spring/spring-kitchen-sink -Pexamples

      - name: Quarkus demo smoke
        run: mvn clean test -pl examples/quarkus/pingcrm,examples/quarkus/kitchen-sink -Pexamples

  e2e:
    name: Playwright browser checks
    runs-on: ubuntu-latest
    needs: examples
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright browser dependencies
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test --config playwright.config.ts --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
